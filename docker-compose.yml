# Só para rodar o bot isolado em desenvolvimento. O ambiente completo (Backend, banco, frontend)
# está em ../shared (docker compose up -d --build).
services:
  whatsapp-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVICE_NAME: whatsapp-microservice
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:8080:8080"
