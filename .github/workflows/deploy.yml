name: Deploy

# Por enquanto só constrói a imagem (sem publicar). Ainda não existe VPS nem registry
# (shared/OWNER.md, A7), e Environments e secrets são do dono (A3). Quando existirem, este fluxo
# segue o do Backend: imagem identificada pelo SHA, promovida entre Environments com aprovação.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t whatsapp-microservice:${{ github.sha }} .
