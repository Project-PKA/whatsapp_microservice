name: Code Quality

# Análise estática via SonarCloud. Precisa do secret SONAR_TOKEN, do projeto criado no SonarCloud e
# da "Automatic Analysis" desligada (shared/OWNER.md, A4). Sem o token, o passo é pulado com aviso
# em vez de falhar o PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Testes com cobertura
        if: env.SONAR_TOKEN != ''
        run: |
          make setup
          make test

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aviso
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN ausente; análise do SonarCloud ignorada (shared/OWNER.md, A4)."
