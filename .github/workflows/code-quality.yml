name: Code Quality

# Análise estática via SonarCloud. Requer o secret SONAR_TOKEN
# configurado no repositório (ver checklist de configuração manual no
# README.md) e o projeto criado em https://sonarcloud.io.
#
# TODO(bootstrap): preencher sonar.projectKey e sonar.organization em
# sonar-project.properties (ou nos parâmetros abaixo) e, se a stack
# gerar relatório de cobertura, apontar sonar.*.coverage.reportPaths.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Enquanto o repositório for o modelo (ainda há TODO(bootstrap) em sonar-project.properties), os passos que dependem
  # da stack não têm o que rodar e falhariam em todo PR. O portão os pula; quando o bootstrap
  # terminar e o marcador sumir, tudo passa a rodar sozinho.
  gate:
    name: Modelo?
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.check.outputs.template }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -q 'TODO(bootstrap)' sonar-project.properties; then
            echo "template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Repositório ainda é o modelo (TODO(bootstrap) em sonar-project.properties); análise ignorada."
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.template != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
