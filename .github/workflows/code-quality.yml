name: Code Quality

# Análise estática via SonarCloud. Precisa do secret SONAR_TOKEN, do projeto criado no SonarCloud e
# da "Automatic Analysis" desligada (shared/OWNER.md, A4). Sem o token, o passo é pulado com aviso
# em vez de falhar o PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Testes com cobertura
        if: env.SONAR_TOKEN != ''
        run: |
          make setup
          make test

      # Não bloqueia enquanto a "Automatic Analysis" do SonarCloud estiver ligada: o scanner recusa
      # rodar junto com ela ("You are running CI analysis while Automatic Analysis is enabled"). O
      # gate da PR continua vindo do check "SonarCloud Code Analysis". Quando o dono desligar a
      # Automatic Analysis (shared/OWNER.md, A4), trocar por `continue-on-error: false`.
      - name: SonarCloud Scan
        id: scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aviso de falha no scanner
        if: steps.scan.outcome == 'failure'
        run: echo "::warning::O scanner do SonarCloud falhou (provável conflito com a Automatic Analysis, OWNER.md A4). Veja o log do passo anterior."

      - name: Aviso
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN ausente; análise do SonarCloud ignorada (shared/OWNER.md, A4)."
