name: CodeQL

# Análise de segurança estática via CodeQL.
#
# TODO(bootstrap): definir a(s) linguagem(ns) real(is) do serviço na
# matrix abaixo. Valores suportados:
# https://docs.github.com/pt/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
# (ex: 'go', 'javascript-typescript', 'python', 'java-kotlin', 'ruby', 'csharp')

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["TODO"] # TODO(bootstrap): substituir pela(s) linguagem(ns) real(is)

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
