name: GitHub Agent

# Automação de governança do repositório, no mesmo padrão dos outros
# templates:
#   - valida Conventional Commits no título do PR
#   - valida o nome da branch
#   - aplica labels automáticas com base no tipo de commit
#   - adiciona o PR/issue a um GitHub Project
#
# O passo do GitHub Project só funciona depois que o dono criar o Project, preencher PROJECT_URL
# e cadastrar GH_PROJECT_TOKEN (shared/OWNER.md, A8). Até lá ele não bloqueia.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-conventional-commits:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Padrão do projeto: <tipo>/<descricao-curta> (feature, fix, chore, docs, test, refactor, ci).
          pattern='^(feat|feature|fix|chore|docs|refactor|test|ci)/[a-z0-9._-]+$'
          if ! echo "$BRANCH_NAME" | grep -qE "$pattern"; then
            echo "::error::Nome de branch '$BRANCH_NAME' não segue o padrão '$pattern'"
            exit 1
          fi

  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    steps:
      - name: Label by conventional commit type
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:/);
            if (!match) return;
            const typeToLabel = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              chore: "chore",
              refactor: "refactor",
              test: "test",
              ci: "ci",
            };
            const label = typeToLabel[match[1]];
            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
            }

  add-to-project:
    name: Add PR to GitHub Project
    runs-on: ubuntu-latest
    # Só roda quando o dono criar o Project e cadastrar PROJECT_URL e GH_PROJECT_TOKEN (shared/OWNER.md, A8).
    if: vars.PROJECT_URL != ''
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.GH_PROJECT_TOKEN }}
