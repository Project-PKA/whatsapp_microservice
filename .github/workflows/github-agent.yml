name: GitHub Agent

# Automação de governança do repositório, no mesmo padrão dos outros
# templates:
#   - valida Conventional Commits no título do PR
#   - valida o nome da branch
#   - aplica labels automáticas com base no tipo de commit
#   - adiciona o PR/issue a um GitHub Project
#   - comenta no PR o resultado de lint/testes/cobertura do job CI
#
# TODO(bootstrap): criar o GitHub Project e preencher PROJECT_URL nos
# secrets/vars do repositório, e garantir que GH_PROJECT_TOKEN (um PAT
# com escopo `project`) exista como secret — o GITHUB_TOKEN padrão não
# tem permissão para adicionar itens a um Project (ver checklist no
# README.md).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-conventional-commits:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # TODO(bootstrap): ajustar o padrão de nome de branch do time,
          # se for diferente de <tipo>/<descricao-curta>.
          pattern='^(feat|fix|chore|docs|refactor|test|ci)/[a-z0-9._-]+$'
          if ! echo "$BRANCH_NAME" | grep -qE "$pattern"; then
            echo "::error::Nome de branch '$BRANCH_NAME' não segue o padrão '$pattern'"
            exit 1
          fi

  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    steps:
      - name: Label by conventional commit type
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?:/);
            if (!match) return;
            const typeToLabel = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              chore: "chore",
              refactor: "refactor",
              test: "test",
              ci: "ci",
            };
            const label = typeToLabel[match[1]];
            if (label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
            }

  add-to-project:
    name: Add PR to GitHub Project
    runs-on: ubuntu-latest
    steps:
      # TODO(bootstrap): descomentar após criar o Project e configurar os secrets.
      # - uses: actions/add-to-project@v1
      #   with:
      #     project-url: ${{ vars.PROJECT_URL }}
      #     github-token: ${{ secrets.GH_PROJECT_TOKEN }}
      - run: echo "TODO bootstrap - configurar GitHub Project (ver README.md)"

  comment-ci-results:
    name: Comment CI results on PR
    runs-on: ubuntu-latest
    steps:
      # TODO(bootstrap): buscar o resultado real do workflow CI (via
      # workflow_run ou artifact de cobertura) e substituir o corpo
      # fixo abaixo por um resumo de lint/testes/cobertura.
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "TODO(bootstrap): comentário automático com resultado de lint/testes/cobertura ainda não configurado.",
            });
