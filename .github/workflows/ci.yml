name: CI

# Roda em todo PR. Os passos de install/lint/test são placeholders:
# devem ser preenchidos na entrevista do BOOTSTRAP.md, de acordo com a
# stack escolhida (ver Makefile — os alvos `setup`, `lint`, `test` são
# a fonte da verdade; este workflow só os invoca).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enquanto o repositório for o modelo (ainda há TODO(bootstrap) em Makefile), os passos que dependem
  # da stack não têm o que rodar e falhariam em todo PR. O portão os pula; quando o bootstrap
  # terminar e o marcador sumir, tudo passa a rodar sozinho.
  gate:
    name: Modelo?
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.check.outputs.template }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -q 'TODO(bootstrap)' Makefile; then
            echo "template=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Repositório ainda é o modelo (TODO(bootstrap) em Makefile); análise ignorada."
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.template != 'true'
    steps:
      - uses: actions/checkout@v4

      # TODO(bootstrap): configurar o runtime da stack escolhida
      # (ex: actions/setup-go, actions/setup-node, actions/setup-python)
      # - uses: actions/setup-TODO@v5

      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # TODO(bootstrap): configurar o runtime da stack escolhida
      # - uses: actions/setup-TODO@v5

      - name: Install dependencies
        run: make setup

      - name: Test
        run: make test

      # TODO(bootstrap): publicar relatório de cobertura como artifact,
      # para o github-agent.yml comentar o resultado no PR.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage
      #     path: TODO-caminho-do-relatorio-de-cobertura

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

  # Validação de Conventional Commits e nome de branch roda no
  # workflow .github/workflows/github-agent.yml, junto com o resto da
  # automação de GitHub (labels, GitHub Project, comentário no PR).
