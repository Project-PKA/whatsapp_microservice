name: CI

# Roda em todo PR e em todo push para main. Os comandos reais moram no Makefile
# (fonte da verdade): este workflow só os invoca.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: make setup
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # Os testes de integração aplicam as migrations do Backend (repositório público).
      - uses: actions/checkout@v4
        with:
          repository: Project-PKA/Backend
          ref: main
          path: backend-src
          sparse-checkout: migrations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: make setup
      - name: Test
        run: make test
        env:
          BACKEND_MIGRATIONS_DIR: ${{ github.workspace }}/backend-src/migrations
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: make build
      - name: Build da imagem Docker
        run: docker build -t whatsapp-microservice:ci .

  # Validação de Conventional Commits e nome de branch roda em github-agent.yml.
