[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-bot"
version = "0.1.0"
description = "Bot de WhatsApp do pokemonAuction: lê lances no grupo e registra pela função place_bid do banco."
requires-python = ">=3.10"
dependencies = [
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "psycopg-pool==3.3.3",
  "neonize==0.5.2",
]

[project.optional-dependencies]
# Versões fixas: aprovadas pelo dono em 2026-10-18 (ruff, mypy, pytest e hypothesis: MIT/MPL-2.0).
dev = [
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.1",
  "testcontainers[postgres]==4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/spike", "backend-src"]

[tool.ruff.lint]
# E/F/W básicos, isort, bugbear, pyupgrade, simplificações, complexidade (code smells) e Ruff-específicas.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: precisa de Postgres real (Docker)"]

[tool.coverage.run]
source = ["src/pokemon_bot"]
branch = true

[tool.coverage.report]
show_missing = true

# O neonize não publica tipos (sem py.typed): o uso fica isolado em trigger/whatsapp/neonize_handle.py.
[[tool.mypy.overrides]]
module = "neonize.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pokemon_bot.trigger.whatsapp.neonize_handle"
disallow_untyped_decorators = false
